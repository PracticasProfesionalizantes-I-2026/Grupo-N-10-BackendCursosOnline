name: Verificación

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 4-Codigo
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: 4-Codigo/global.json
      - run: dotnet restore Lumen.slnx
      - run: dotnet build Lumen.slnx --no-restore
      - run: dotnet test Lumen.slnx --no-build --no-restore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 3-Interfaz
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: 3-Interfaz/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
